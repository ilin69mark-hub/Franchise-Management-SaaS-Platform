name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (история + HEAD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          args: detect --source . --redact --log-opts=--all -v

  audit-exceptions:
    name: audit-exceptions (маркеры ↔ реестр)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check markers vs registry
        run: bash scripts/check-audit-exceptions.sh

  backend:
    name: backend (go vet/build/test -race)
    runs-on: ubuntu-latest
    needs: gitleaks
    defaults:
      run:
        working-directory: saas-b2b-b2c/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test -short
        run: go test -short ./... -count=1
      - name: go test -race (быстрый)
        run: go test -short -race ./... -count=1 -run Test -timeout 60s
        continue-on-error: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt нужен:"; echo "$out"; exit 1; fi

  frontend:
    name: frontend (tsc/jest/build)
    runs-on: ubuntu-latest
    needs: gitleaks
    defaults:
      run:
        working-directory: saas-b2b-b2c/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: saas-b2b-b2c/frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: tsc --noEmit (должен пройти ДО jest)
        run: npx tsc --noEmit
      - name: jest
        run: npm test -- --passWithNoTests --coverage=false
      - name: next build (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  audit:
    name: audit gate (все джобы зелёные)
    runs-on: ubuntu-latest
    needs: [gitleaks, audit-exceptions, backend, frontend]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.gitleaks.result }}" != "success" ] || [ "${{ needs.audit-exceptions.result }}" != "success" ] || [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "CI gate failed"; exit 1; fi
          echo "CI gate passed"
