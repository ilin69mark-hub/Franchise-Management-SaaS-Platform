# ============================================================================
# РЕЕСТР ИСКЛЮЧЕНИЙ БЕЗОПАСНОСТИ — единственный источник правды.
#
# ## Что это (md-шапка для людей)
# Список A: задачи, которые ТРЕБУЮТ ключей/человека. Их нельзя закрыть
# кодом — только выдачей секрета, командой на VPS или решением владельца.
# У каждой записи: ID, место (файл:строка), риск, почему исключение,
# кто принял + дата, условие снятия. Срока давности нет, но есть явное
# правило: ПРОД БЕЗ ЭТОГО НЕ ЗАПУСКАТЬ (код падает fail-closed там,
# где это проверяется автоматически).
#
# ## Как пользоваться
# - В коде рядом с местом — только короткий маркер:
#     // AUDIT-EXCEPTION(E01): owner-key, см. .audit-exceptions.yml   (Go)
#     #  AUDIT-EXCEPTION(E01): owner-key, см. .audit-exceptions.yml   (yaml/env/sh)
#     <!-- AUDIT-EXCEPTION(E01): owner-key, см. .audit-exceptions.yml --> (md)
#   Решение живёт ТОЛЬКО здесь, маркер — указатель.
# - Будущий аудит (человек или скрипт): сначала читает этот файл и
#   пропускает совпавшие файл+ID (+pattern рядом с маркером, ±3 строки);
#   остальное проверяет как обычно.
# - CI (`scripts/check-audit-exceptions.sh`, job audit-exceptions):
#   1) каждый маркер в репо обязан иметь парный ID в реестре, иначе fail;
#   2) каждая запись обязана иметь маркер в указанном файле, иначе fail;
#   3) pattern обязан быть рядом с маркером (±3 строки), иначе fail
#      (нельзя тихо перетащить маркер на чужой код; строку обновить —
#      можно, вместе с этим файлом в том же коммите).
#
# ## Строгий формат (для скрипта — не менять структуру!)
# version: 1
# entries: список, каждая запись РОВНО с ключами:
#   id, file, line, pattern, title, risk, reason, accepted_by, accepted_at,
#   remove_when, no_expiry. Поле pattern — уникальная подстрока рядом
#   с маркером (проверяется grep -F).
# ============================================================================
