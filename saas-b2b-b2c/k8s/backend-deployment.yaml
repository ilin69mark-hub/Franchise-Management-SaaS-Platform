apiVersion: apps/v1
kind: Deployment
metadata:
  name: franchise-backend
  namespace: franchise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: franchise-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: franchise-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/saas-b2b-b2c/franchise-saas/backend:latest
          ports:
            - containerPort: 8080
          # REAUDIT-4: подключаем ВЕСЬ ConfigMap. Раньше читался только DB_HOST,
          # поэтому REDIS_ADDR/CORS_ALLOWED_ORIGINS/DB_PORT/DB_NAME не доходили
          # до приложения: Redis шёл в localhost (нет общего revocation/rate-limit),
          # CORS и DB_SSLMODE оставались дефолтными.
          envFrom:
            - secretRef:
                name: franchise-secrets
            - configMapRef:
                name: franchise-config
          env:
            # Продакшн-режим фиксируется явно: без него isProdEnv()=false,
            # Gin debug, sslmode=disable и т.п.
            - name: GIN_MODE
              value: "release"
            - name: APP_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: franchise-backend
  namespace: franchise
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: franchise-backend