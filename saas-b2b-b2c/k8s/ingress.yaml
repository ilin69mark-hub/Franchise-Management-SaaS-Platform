apiVersion: v1
kind: Namespace
metadata:
  name: franchise
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: franchise-config
  namespace: franchise
data:
  DB_HOST: "postgres.database.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "franchise_db"
  REDIS_ADDR: "redis.cache.svc.cluster.local:6379"
  CORS_ALLOWED_ORIGINS: "https://yourdomain.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: franchise-secrets
  namespace: franchise
type: Opaque
stringData:
  # NOTE: Values below are NON-SECRET placeholders and must NOT be used in production.
  # Set real secrets via CI/CD (kubectl apply -f) or recommend ExternalSecrets (ESO) with a
  # SecretStore backed by Vault/AWS Secrets Manager, then drop this inline Secret.
  DB_USER: "postgres"
  DB_PASSWORD: "CHANGE_ME_JWT_SECRET"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET"
  REDIS_PASSWORD: "CHANGE_ME_JWT_SECRET"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: franchise-ingress
  namespace: franchise
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - yourdomain.com
      secretName: franchise-tls
  rules:
    - host: yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: franchise-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: franchise-frontend
                port:
                  number: 80