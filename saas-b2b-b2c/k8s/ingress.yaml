apiVersion: v1
kind: Namespace
metadata:
  name: franchise
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: franchise-config
  namespace: franchise
data:
  DB_HOST: "postgres.database.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "franchise_db"
  REDIS_ADDR: "redis.cache.svc.cluster.local:6379"
  CORS_ALLOWED_ORIGINS: "https://yourdomain.com"
---
# RE-AUDIT(E11): inline-Secret удалён — три одинаковых CHANGE_ME-плейсхолдера
# приглашали к копипасту в прод. Секреты тянет ESO из Vault/AWS SM.
# Человек: поставить ESO, завести SecretStore + записи, проверить
# (kubectl -n franchise get secret franchise-secrets), см. .audit-exceptions.yml E11.
# AUDIT-EXCEPTION(E11): owner-key, см. .audit-exceptions.yml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: franchise-secrets
  namespace: franchise
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: franchise-vault # заменить на свой SecretStore (Vault/AWS SM)
  target:
    name: franchise-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef: { key: franchise/prod, property: DB_USER }
    - secretKey: DB_PASSWORD
      remoteRef: { key: franchise/prod, property: DB_PASSWORD }
    - secretKey: JWT_SECRET
      remoteRef: { key: franchise/prod, property: JWT_SECRET }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: franchise/prod, property: REDIS_PASSWORD }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: franchise-ingress
  namespace: franchise
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - yourdomain.com
      secretName: franchise-tls
  rules:
    - host: yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: franchise-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: franchise-frontend
                port:
                  number: 80